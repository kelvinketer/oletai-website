<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biosurveillance Map | Oletai Agro Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        #map { height: 70vh; width: 100%; border-radius: 1rem; z-index: 1; }
        .oletai-bg { background-color: #0C462B; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <nav class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
        <div class="text-2xl font-black tracking-tighter" style="color: #0C462B;">
            OLETAI <span class="text-gray-400 font-medium">RESEARCH</span>
        </div>
        <a href="index.html" class="text-sm font-bold text-gray-500 hover:text-green-800">← Back to Main Site</a>
    </nav>

    <div class="container mx-auto px-6 py-8">
        <h1 class="text-3xl font-black text-gray-900 mb-2">Live Biosurveillance Network</h1>
        <p class="text-gray-500 max-w-3xl">Real-time geospatial tracking of crop diseases, pests, and agronomic anomalies reported by the Rahisi Pay farmer network across Kenya.</p>
        
        <div class="grid grid-cols-3 gap-6 mt-8 mb-8">
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                <div class="text-sm text-gray-500 font-bold mb-1">TOTAL SCANS</div>
                <div class="text-3xl font-black text-green-800" id="totalScans">Loading...</div>
            </div>
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                <div class="text-sm text-gray-500 font-bold mb-1">ACTIVE REGIONS</div>
                <div class="text-3xl font-black text-green-800">4</div>
            </div>
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                <div class="text-sm text-gray-500 font-bold mb-1">LATEST OUTBREAK</div>
                <div class="text-xl font-bold text-orange-600 mt-2">Maize Necrosis (Tracked)</div>
            </div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-lg border border-gray-200">
            <div id="map"></div>
        </div>
    </div>

    <script>
        // 1. Initialize the map and set default view to Kenya
        const map = L.map('map').setView([-1.2921, 36.8219], 6); // Centered near Nairobi

        // 2. Add the OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors | Oletai Agro Group Data'
        }).addTo(map);

        // Custom Green Marker Icon
        const oletaiIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // 3. Fetch Data from your Render Backend
        async function fetchMapData() {
            try {
                // Ensure your Render URL is correct here
                const response = await fetch('https://rahisipay-api.onrender.com/api/v1/research/map-data');
                const data = await response.json();
                
                document.getElementById('totalScans').innerText = data.length;

                // 4. Plot each data point on the map
                data.forEach(point => {
                    const popupContent = `
                        <div style="font-family: Inter, sans-serif;">
                            <strong style="color: #0C462B;">Scan Date:</strong> ${point.date}<br>
                            ${point.image_url ? `<img src="${point.image_url}" style="width: 100%; height: 100px; object-fit: cover; border-radius: 8px; margin-top: 8px; margin-bottom: 8px;" />` : ''}
                            <p style="font-size: 12px; margin: 0; color: #555;">${point.diagnosis}</p>
                        </div>
                    `;

                    L.marker([point.lat, point.lng], {icon: oletaiIcon})
                     .addTo(map)
                     .bindPopup(popupContent);
                });
            } catch (error) {
                console.error("Error loading map data:", error);
                document.getElementById('totalScans').innerText = "Error";
            }
        }

        // Load data on page load
        fetchMapData();
    </script>
</body>
</html>
